version: '3.8'

services:
  brute-force:
    build: .
    profiles: ["brute-force"]
    volumes:
      - ./brute-force:/app
    ports:
      - "5000:5000"


  brute-force-mg:
      build: .
      profiles: [ "brute-force-mg" ]
      volumes:
        - ./brute-force/defend:/app
      ports:
        - "5000:5000"

  sql-injection:
    build: .
    profiles: [ "sql-injection" ]
    volumes:
      - ./sql-injection:/app
    ports:
      - "5001:5000"